services:
  postgres:
    image: postgres:16
    container_name: bytestore-postgres
    restart: always

    environment:
      POSTGRES_DB: bytestore
      POSTGRES_USER: bytestore
      POSTGRES_PASSWORD: bytestore123

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: